<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 grid wipe</title><link rel="stylesheet" href="shared.css">
<style>#wipe{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none;display:none}</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="wipe"></canvas>
<div class="dom"><main>
  <div class="top">
    <div class="pad"><h1><span>Matthias&nbsp;&nbsp;M.</span><br><span>Oberholzer</span></h1>
      <div class="status"><p>Available for freelance work</p></div></div>
    <ul id="carousel" class="carousel"></ul>
    <div class="copy"><p>Matthias is a web developer, student, and Awwwards Young Jury Member who explores WebGL and Three.js.</p></div>
  </div>
  <ul id="list" class="list"></ul>
</main>
<footer class="footer"><div>Salzburg, Austria</div><div>hello@mot.codes &copy; 2026</div></footer></div>
<script src="shared.js"></script>
<script>
const K = PreviewKit, d = PREVIEW_DATA;
const stage = PixelStage(document.getElementById('gl'), { portrait: d.portrait, images: d.projects.map(p => p.image) });
const btnFor = (i) => document.querySelectorAll(matchMedia('(min-width:1024px)').matches ? '#list button' : '#carousel button')[i];
K.label('05 grid wipe', 'square cells fill in a stepped ring from the click point, view swaps under them, cells clear outward');
const cv = document.getElementById('wipe'), cx = cv.getContext('2d');
let W, H;
const size = () => { const k = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight; cv.width = W * k; cv.height = H * k; cx.setTransform(k, 0, 0, k, 0, 0); };
size(); addEventListener('resize', size);
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const easeOut = (t) => 1 - Math.pow(1 - t, 4), easeIn = (t) => t ** 4;
// 60 columns of square cells, delay = distance from origin + jitter; cover fills them, uncover empties them outward
function sweep(o, cover) {
  return new Promise((done) => {
    const dur = cover ? 650 : 750, cs = W / 60, rows = Math.ceil(H / cs);
    const maxD = Math.hypot(Math.max(o.x, W - o.x), Math.max(o.y, H - o.y)), cells = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < 60; c++) {
      const dist = Math.hypot(c * cs + cs / 2 - o.x, r * cs + cs / 2 - o.y) / maxD;
      cells.push([c * cs, r * cs, 0.6 * dist + 0.05 * Math.random()]);
    }
    cv.style.display = 'block';
    const t0 = performance.now();
    const frame = (now) => {
      const t = Math.min(1, Math.max(0, (now - t0) / dur));
      cx.clearRect(0, 0, W, H); cx.fillStyle = '#0D0D0D';
      for (const [x, y, delay] of cells) {
        const local = clamp01((t - delay) / 0.3), p = cover ? easeOut(local) : 1 - easeIn(local);
        if (p <= 0) continue;
        const s = cs * p + 0.5; // +0.5 hides hairline seams between full cells
        cx.fillRect(x + (cs - s) / 2, y + (cs - s) / 2, s, s);
      }
      if (t < 1) return requestAnimationFrame(frame);
      if (!cover) { cx.clearRect(0, 0, W, H); cv.style.display = 'none'; }
      done();
    };
    requestAnimationFrame(frame);
  });
}
K.flow({
  stage,
  show() { stage.fx.zoom = 1; },
  hide() { stage.fx.zoom = 0; },
  async enter(c) {
    await sweep(c.pt, true);
    stage.fx.zoom = 1; c.awayIndex(); c.openProject();
    K.stagger(c.el.parts.items, 'in', { delay: 150, step: 50, duration: 700 });
    await sweep(c.pt, false);
  },
  async leave(c) {
    await sweep(c.pt, true);
    stage.fx.zoom = 0; c.closeProject(); c.returnIndex();
    K.stagger(K.indexParts(), 'in', { delay: 150, step: 30, duration: 700, y: 20 });
    await sweep(c.pt, false);
  },
});
</script></body></html>
