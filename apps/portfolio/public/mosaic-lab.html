<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mosaic lab</title>
    <!-- one-off preview of hover-mosaic transitions; not linked from the site, delete once a direction is picked -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0d0d0d; color: #fff; overflow: hidden; }
      body { font: 11px/1.35 'Helvetica Neue', Helvetica, Arial, sans-serif; text-transform: uppercase; letter-spacing: 0.02em; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      button, select { font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      select { flex: 1; border-bottom: 1px solid rgb(255 255 255 / 0.3); padding: 2px 0; }
      option { background: #0d0d0d; }
      header { position: fixed; top: 24px; left: 24px; font-size: 32px; line-height: 0.95; letter-spacing: -0.01em; pointer-events: none; }
      header small { display: block; margin-top: 10px; font-size: 11px; letter-spacing: 0.02em; opacity: 0.5; }
      #list { position: fixed; left: 24px; top: 50%; transform: translateY(-50%); list-style: none; margin: 0; padding: 0; }
      #list button { display: block; padding: 2px 0; transition: opacity 0.2s; }
      #list.has-active button:not(.active) { opacity: 0.4; }
      #controls { position: fixed; right: 24px; top: 24px; width: 320px; max-height: calc(100% - 48px); overflow-y: auto; display: grid; gap: 8px; padding: 12px; background: rgb(13 13 13 / 0.85); }
      #modes { display: flex; gap: 16px; }
      #modes label { display: flex; gap: 6px; align-items: baseline; cursor: pointer; opacity: 0.45; transition: opacity 0.2s; }
      #modes label:has(input:checked), #modes label:hover { opacity: 1; }
      #modes input { position: absolute; opacity: 0; pointer-events: none; }
      #modes label:has(input:focus-visible) { outline: 1px solid #fff; outline-offset: 2px; }
      #modes kbd { font: inherit; opacity: 0.6; }
      #desc { margin: 0; text-transform: none; letter-spacing: 0; font-size: 12px; opacity: 0.7; }
      fieldset { border: 0; border-top: 1px solid rgb(255 255 255 / 0.15); margin: 4px 0 0; padding: 8px 0 0; display: grid; gap: 6px; }
      fieldset[hidden] { display: none; }
      legend { padding: 0 6px 0 0; opacity: 0.5; }
      .row { display: flex; align-items: center; gap: 10px; }
      .row span:first-child { width: 92px; flex: none; }
      .row output { width: 52px; flex: none; text-align: right; opacity: 0.6; }
      input[type='range'] { flex: 1; min-width: 0; accent-color: #fff; }
      #actions { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 4px; }
      #actions button, #actions label { opacity: 0.6; }
      #actions button:hover, #actions label:hover { opacity: 1; }
      #status { position: fixed; bottom: 24px; left: 24px; opacity: 0.5; }
      @media (max-width: 1023px) {
        header { font-size: 22px; }
        #controls { top: auto; bottom: 16px; right: 16px; left: 16px; width: auto; max-height: 45%; }
        #desc { display: none; }
        #list { top: 96px; transform: none; }
        #status { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <header>Mosaic<br />lab<small>hover a project · 1/2 switch effect · R replays</small></header>
    <ul id="list"></ul>
    <form id="controls" onsubmit="return false">
      <div id="modes" role="radiogroup" aria-label="Transition"></div>
      <p id="desc"></p>
      <fieldset id="shared"><legend>Ring</legend></fieldset>
      <fieldset id="mode-0" hidden><legend>Circle push</legend></fieldset>
      <fieldset id="mode-1" hidden><legend>Shockwave</legend></fieldset>
      <div id="actions">
        <button id="replay" type="button">Replay (R)</button>
        <label><input id="auto" type="checkbox" /> Auto-cycle</label>
        <button id="copy" type="button">Copy settings</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </form>
    <p id="status">Loading images…</p>

    <script>
      const CDN = 'https://cdn.sanity.io/images/qhdnmhc0/production/'
      const PROJECTS = [
        ['Dom Perignon', '11ab7eea9445ae3595693af88eb3dfed372c1c9e-1440x800.jpg'],
        ['Kelly Wearstler', '1e947440f99a6c6f54eba94f3d6fd643a09c6ab1-1440x800.jpg'],
        ['LA Burdick', '321e2847c5f97808c410807d5a4d85cbaa1e8677-1440x800.jpg'],
        ['Caravane', 'efe7031ebfb085214af5f9c44137151099a852e8-1440x800.jpg'],
        ['Coterie', 'f8b60903be1f2b44cf45c55b98ffffb6a7926dab-1440x800.jpg'],
        ['Landlife', 'e4c7cc7dd230df9f72d0fa1900e5c301f6fc4ea4-1440x800.jpg'],
        ['Daylight', 'c5063f942f4c12524dca6e57e58aa85495750803-1440x800.jpg'],
        ['Face Formular', 'f1d8e282699496f484c5b3a6bf3a9afbfeff25a1-1440x800.jpg'],
        ['Marble', '5150d3b6215d47792ac89c08331f5dfbb180f2c2-1440x800.jpg'],
        ['QIQI', 'dbc3081081c66ad82dbe9c08fcc8f0b6ed0cb4a1-1440x800.jpg'],
        ['Sarah Sey', '61fc98083f9bd20ae6040b9f777b281447f95b9a-1440x800.jpg'],
      ]

      const MODES = [
        ['Circle push', 'A ring grows from the origin. As it reaches a cell, the new image slides into the cell and pushes the old content out, the same translation the hover mosaic uses.'],
        ['Shockwave', 'The ring is a kick of the hover distortion itself: cells get thrown along the ring, swap to the new image at the peak and relax back into place.'],
      ]

      // order matches the ease() switch in the shader
      const EASES = ['linear', 'outCubic', 'outQuart', 'outExpo', 'inOutCubic', 'outBack']

      // mode: null = shared ring control, 0 = circle push, 1 = shockwave
      const PARAMS = [
        { id: 'duration', label: 'Duration', min: 0.3, max: 5, step: 0.1, value: 2, unit: 's', mode: null },
        { id: 'cells', label: 'Cells', min: 8, max: 100, step: 1, value: 60, mode: null },
        { id: 'ringEase', label: 'Ring easing', options: EASES, value: 'outQuart', mode: null },
        { id: 'cellTime', label: 'Cell time', min: 0.05, max: 0.9, step: 0.01, value: 0.45, mode: null, hint: 'share of the duration one cell takes; the rest is the ring travelling' },
        { id: 'jitter', label: 'Ring jitter', min: 0, max: 1, step: 0.01, value: 0.15, mode: null },
        { id: 'angle', label: 'Angle', min: -180, max: 180, step: 5, value: 0, unit: '°', mode: null, hint: '0 outward, 90 swirl, 180 inward' },
        { id: 'origin', label: 'Origin', options: ['centre', 'cursor'], value: 'centre', mode: null },
        { id: 'cellEase', label: 'Cell easing', options: EASES, value: 'outCubic', mode: 0 },
        { id: 'distance', label: 'Push distance', min: 0.25, max: 8, step: 0.25, value: 1, unit: ' cells', mode: 0 },
        { id: 'amplitude', label: 'Kick', min: 0, max: 12, step: 0.25, value: 3, unit: ' cells', mode: 1 },
        { id: 'variance', label: 'Kick variance', min: 0, max: 1, step: 0.01, value: 0.5, mode: 1 },
        { id: 'swap', label: 'Swap point', min: 0.05, max: 0.95, step: 0.01, value: 0.5, mode: 1 },
        { id: 'swapJitter', label: 'Swap jitter', min: 0, max: 0.8, step: 0.01, value: 0.3, mode: 1 },
        { id: 'kickEase', label: 'Kick shape', options: ['sine', 'snap', 'late'], value: 'sine', mode: 1, hint: 'sine: up and down evenly; snap: fast out, slow settle; late: slow out, fast settle' },
      ]

      const SETTINGS = { mouse: 0.075, strength: 0.3, relaxation: 0.95, contain: 0.8 }
      const MAX_LAYERS = 6
      const STORAGE = 'mosaic-lab'

      const VERT = `#version 300 es
      out vec2 vUv;
      void main() {
        vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
        vUv = p;
        gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
      }`

      const FRAG = `#version 300 es
      precision highp float;
      in vec2 vUv;
      out vec4 outColor;

      uniform int uPass;          // 0 base image, 1 transition, 2 display with hover mosaic
      uniform sampler2D uFrom;    // screen-space composite of everything below this transition
      uniform sampler2D uTo;      // incoming image
      uniform vec2 uToScale;      // cover or contain fit of the incoming image
      uniform float uProgress;
      uniform int uMode;
      uniform float uSeed;
      uniform vec2 uOrigin;       // ring origin in uv
      uniform vec2 uRes;
      uniform float uGrid;
      uniform sampler2D uData;    // hover mosaic: per-cell offsets

      uniform int uRingEase;
      uniform float uCellTime;
      uniform float uJitter;
      uniform float uAngle;
      uniform int uCellEase;
      uniform float uDistance;
      uniform float uAmplitude;
      uniform float uVariance;
      uniform float uSwap;
      uniform float uSwapJitter;
      uniform int uKickEase;

      const vec3 BG = vec3(13.0 / 255.0);
      const float PI = 3.14159265;

      bool outside(vec2 uv) { return any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0))); }
      vec3 img(vec2 uv) {
        vec2 t = (uv - 0.5) * uToScale + 0.5;
        return outside(t) ? BG : texture(uTo, t).rgb;
      }
      vec3 from(vec2 uv) { return outside(uv) ? BG : texture(uFrom, uv).rgb; }
      float hash(vec2 p) {
        p = fract(p * vec2(123.34, 456.21) + uSeed);
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }
      float ease(int k, float t) {
        if (k == 1) return 1.0 - pow(1.0 - t, 3.0);
        if (k == 2) return 1.0 - pow(1.0 - t, 4.0);
        if (k == 3) return t >= 1.0 ? 1.0 : 1.0 - pow(2.0, -10.0 * t);
        if (k == 4) return t < 0.5 ? 4.0 * t * t * t : 1.0 - pow(-2.0 * t + 2.0, 3.0) / 2.0;
        if (k == 5) return 1.0 + 2.70158 * pow(t - 1.0, 3.0) + 1.70158 * pow(t - 1.0, 2.0);
        return t;
      }
      vec2 rotate(vec2 v, float a) { return vec2(v.x * cos(a) - v.y * sin(a), v.x * sin(a) + v.y * cos(a)); }
      // progress at which the ring easing reaches x (bisection, the easings are increasing up to x = 1)
      float easeInverse(int k, float x) {
        float lo = 0.0, hi = 1.0;
        for (int i = 0; i < 16; i++) {
          float mid = 0.5 * (lo + hi);
          if (ease(k, mid) < x) lo = mid; else hi = mid;
        }
        return 0.5 * (lo + hi);
      }

      vec3 transition() {
        vec2 px = vUv * uRes;
        vec2 cs = uRes / uGrid;
        vec2 cell = floor(vUv * uGrid);
        vec2 cc = (cell + 0.5) * cs;
        vec2 q = px - cc;
        vec2 o = uOrigin * uRes;
        vec2 rel = cc - o;
        // normalised so the farthest corner is reached at 1
        float far = max(max(length(o), length(o - vec2(uRes.x, 0.0))), max(length(o - vec2(0.0, uRes.y)), length(o - uRes)));
        float dist = length(rel) / far;
        vec2 dir = rotate(length(rel) > 0.001 ? normalize(rel) : vec2(1.0, 0.0), uAngle);
        float h = hash(cell);

        // the ring's growth is eased, each cell then runs on the linear clock; the farthest cell ends at 1
        float order = min(mix(dist, h, uJitter), 1.0);
        float start = (1.0 - uCellTime) * easeInverse(uRingEase, order);
        float raw = (uProgress - start) / uCellTime;
        if (raw <= 0.0) return from(vUv);
        if (raw >= 1.0) return img(vUv);
        float local = raw;

        if (uMode == 0) {
          // new image slides into the cell along dir and pushes the old content out the far side
          float e = ease(uCellEase, local);
          float half_ = 0.5 * (abs(dir.x) * cs.x + abs(dir.y) * cs.y);
          // the last sub-pixel of the push would only flicker a 1px seam, finish the cell instead;
          // abs and the second half only, so outBack's overshoot still plays
          if (local > 0.5 && abs(1.0 - e) * 2.0 * half_ < 1.0) return img(vUv);
          float u = (dot(q, dir) + half_) / (2.0 * half_);
          float span = 2.0 * half_ * uDistance;
          if (u < e) return img((px + (1.0 - e) * span * dir) / uRes);
          return from((px - e * span * dir) / uRes);
        }

        // shockwave
        float kick = uKickEase == 1 ? (1.0 - pow(1.0 - min(local / 0.25, 1.0), 3.0)) * (1.0 - smoothstep(0.25, 1.0, local))
          : uKickEase == 2 ? smoothstep(0.0, 0.75, local) * (1.0 - smoothstep(0.75, 1.0, local))
          : sin(PI * local);
        float amp = length(cs) * uAmplitude * (1.0 - uVariance + 2.0 * uVariance * h);
        vec2 uv = (px - dir * kick * amp) / uRes;
        float swapAt = uSwap + (hash(cell + 3.0) - 0.5) * uSwapJitter;
        return local < swapAt ? from(uv) : img(uv);
      }

      void main() {
        if (uPass == 0) outColor = vec4(img(vUv), 1.0);
        else if (uPass == 1) outColor = vec4(transition(), 1.0);
        else outColor = vec4(from(vUv - 0.02 * texture(uData, vUv).rg), 1.0);
      }`

      const canvas = document.getElementById('gl')
      const gl = canvas.getContext('webgl2', { antialias: false })
      const status = document.getElementById('status')
      if (!gl) status.textContent = 'WebGL2 not available'

      function compile(type, src) {
        const s = gl.createShader(type)
        gl.shaderSource(s, src)
        gl.compileShader(s)
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s))
        return s
      }
      const program = gl.createProgram()
      gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT))
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG))
      gl.linkProgram(program)
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program))
      gl.useProgram(program)
      const loc = new Proxy({}, { get: (cache, name) => (cache[name] ??= gl.getUniformLocation(program, name)) })
      gl.uniform1i(loc.uFrom, 0)
      gl.uniform1i(loc.uTo, 1)
      gl.uniform1i(loc.uData, 2)

      function texture(filter) {
        const t = gl.createTexture()
        gl.bindTexture(gl.TEXTURE_2D, t)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
        return t
      }

      // ping-pong targets: base image, then one pass per running transition on top of the previous result
      let targets = []
      function resize() {
        const dpr = Math.min(devicePixelRatio, 2)
        canvas.width = Math.round(innerWidth * dpr)
        canvas.height = Math.round(innerHeight * dpr)
        for (const t of targets) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb) }
        targets = [0, 1].map(() => {
          const tex = texture(gl.LINEAR)
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, canvas.width, canvas.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null)
          const fb = gl.createFramebuffer()
          gl.bindFramebuffer(gl.FRAMEBUFFER, fb)
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0)
          return { tex, fb }
        })
      }
      addEventListener('resize', resize)
      resize()

      // controls
      const saved = JSON.parse(localStorage.getItem(STORAGE) || '{}')
      const values = Object.fromEntries(PARAMS.map((p) => [p.id, saved[p.id] ?? p.value]))
      const inputs = {}
      for (const p of PARAMS) {
        const row = document.createElement('label')
        row.className = 'row'
        if (p.hint) row.title = p.hint
        const input = document.createElement(p.options ? 'select' : 'input')
        input.id = p.id
        if (p.options) input.innerHTML = p.options.map((o) => `<option>${o}</option>`).join('')
        else Object.assign(input, { type: 'range', min: p.min, max: p.max, step: p.step })
        input.value = values[p.id]
        const out = document.createElement('output')
        const show = () => (out.textContent = p.options ? '' : input.value + (p.unit ?? ''))
        input.addEventListener('input', () => {
          values[p.id] = p.options ? input.value : +input.value
          localStorage.setItem(STORAGE, JSON.stringify(values))
          show()
          if (p.id === 'cells') regenerateGrid(false)
        })
        show()
        row.append(Object.assign(document.createElement('span'), { textContent: p.label }), input, out)
        document.getElementById(p.mode === null ? 'shared' : `mode-${p.mode}`).append(row)
        inputs[p.id] = { input, show }
      }

      // hover mosaic, ported from pixelDistortion.jsx: per-cell offsets pushed by mouse velocity, relaxing to 0
      let grid = values.cells
      let data
      const dataTex = texture(gl.NEAREST)
      function regenerateGrid(scatter) {
        grid = values.cells
        data = new Float32Array(4 * grid * grid)
        if (scatter) for (let i = 0; i < data.length; i += 4) {
          data[i] = Math.random() * 255 - 125
          data[i + 1] = Math.random() * 255 - 125
        }
      }
      regenerateGrid(true)

      const mouse = { x: 0.5, y: 0.5, vX: 0, vY: 0, seen: false }
      addEventListener('pointermove', (e) => {
        const x = e.clientX / innerWidth
        const y = e.clientY / innerHeight
        if (mouse.seen) { mouse.vX = x - mouse.x; mouse.vY = y - mouse.y }
        Object.assign(mouse, { x, y, seen: true })
      })

      function stepMosaic() {
        for (let i = 0; i < data.length; i += 4) {
          data[i] *= SETTINGS.relaxation
          data[i + 1] *= SETTINGS.relaxation
        }
        const gx = grid * mouse.x
        const gy = grid * (1 - mouse.y)
        const maxDist = grid * SETTINGS.mouse
        const aspect = innerHeight / innerWidth
        for (let i = 0; i < grid; i++) {
          for (let j = 0; j < grid; j++) {
            const distance = (gx - i) ** 2 / aspect + (gy - j) ** 2
            if (distance < maxDist ** 2) {
              const index = 4 * (i + grid * j)
              const power = Math.min(Math.max(maxDist / Math.sqrt(distance), 0), 10)
              data[index] += SETTINGS.strength * 100 * mouse.vX * power
              data[index + 1] -= SETTINGS.strength * 100 * mouse.vY * power
            }
          }
        }
        mouse.vX *= 0.9
        mouse.vY *= 0.9
        gl.activeTexture(gl.TEXTURE2)
        gl.bindTexture(gl.TEXTURE_2D, dataTex)
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, grid, grid, 0, gl.RGBA, gl.FLOAT, data)
      }

      // images: 0 is the portrait (cover), the rest are projects (contained at 80%)
      const images = []
      function load(src) {
        return new Promise((resolve, reject) => {
          const img = new Image()
          img.crossOrigin = 'anonymous'
          img.onload = () => {
            const tex = texture(gl.LINEAR)
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true)
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img)
            // flip is global state; left on it would mirror the hover offset grid too
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false)
            resolve({ tex, aspect: img.naturalWidth / img.naturalHeight })
          }
          img.onerror = () => reject(new Error('Failed to load ' + src))
          img.src = src
        })
      }
      function fitScale(index) {
        const imageAspect = images[index].aspect
        const viewportAspect = innerWidth / innerHeight
        if (index === 0)
          return viewportAspect > imageAspect ? [1, imageAspect / viewportAspect] : [viewportAspect / imageAspect, 1]
        const width = Math.min(1, imageAspect / viewportAspect) * SETTINGS.contain
        return [1 / width, imageAspect / viewportAspect / width]
      }

      // state: base image plus transitions playing on top of it, oldest first
      const state = { base: 0, layers: [], previous: 0, mode: saved.mode ?? 0 }
      const target = () => (state.layers.length ? state.layers.at(-1).to : state.base)
      const layer = (to) => ({
        to,
        progress: 0,
        mode: state.mode,
        seed: Math.random() * 100,
        // uv, y up
        origin: values.origin === 'cursor' && mouse.seen ? [mouse.x, 1 - mouse.y] : [0.5, 0.5],
      })

      function go(to) {
        if (!images.length || to === target()) return
        state.previous = target()
        state.layers.push(layer(to))
        // shortcut: past MAX_LAYERS the oldest transition snaps to done; fine for a preview
        if (state.layers.length > MAX_LAYERS) state.base = state.layers.shift().to
        markActive(to)
      }
      function replay() {
        const to = target()
        if (to === state.previous) return
        state.base = state.previous
        state.layers = [layer(to)]
      }

      let last = performance.now()
      function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.1)
        last = now
        stepMosaic()

        for (const l of state.layers) l.progress = Math.min(1, l.progress + dt / values.duration)
        const done = state.layers.findLastIndex((l) => l.progress >= 1)
        if (done >= 0) {
          state.base = state.layers[done].to
          state.layers = state.layers.slice(done + 1)
        }

        gl.viewport(0, 0, canvas.width, canvas.height)
        gl.uniform2f(loc.uRes, innerWidth, innerHeight)
        gl.uniform1f(loc.uGrid, grid)
        gl.uniform1i(loc.uRingEase, EASES.indexOf(values.ringEase))
        gl.uniform1i(loc.uCellEase, EASES.indexOf(values.cellEase))
        gl.uniform1f(loc.uCellTime, values.cellTime)
        gl.uniform1f(loc.uJitter, values.jitter)
        gl.uniform1f(loc.uAngle, (values.angle * Math.PI) / 180)
        gl.uniform1f(loc.uDistance, values.distance)
        gl.uniform1f(loc.uAmplitude, values.amplitude)
        gl.uniform1f(loc.uVariance, values.variance)
        gl.uniform1f(loc.uSwap, values.swap)
        gl.uniform1f(loc.uSwapJitter, values.swapJitter)
        gl.uniform1i(loc.uKickEase, ['sine', 'snap', 'late'].indexOf(values.kickEase))

        let current = 0
        gl.bindFramebuffer(gl.FRAMEBUFFER, targets[0].fb)
        gl.uniform1i(loc.uPass, 0)
        gl.activeTexture(gl.TEXTURE1)
        gl.bindTexture(gl.TEXTURE_2D, images[state.base].tex)
        gl.uniform2fv(loc.uToScale, fitScale(state.base))
        gl.drawArrays(gl.TRIANGLES, 0, 3)

        gl.uniform1i(loc.uPass, 1)
        for (const l of state.layers) {
          const next = 1 - current
          gl.bindFramebuffer(gl.FRAMEBUFFER, targets[next].fb)
          gl.activeTexture(gl.TEXTURE0)
          gl.bindTexture(gl.TEXTURE_2D, targets[current].tex)
          gl.activeTexture(gl.TEXTURE1)
          gl.bindTexture(gl.TEXTURE_2D, images[l.to].tex)
          gl.uniform2fv(loc.uToScale, fitScale(l.to))
          gl.uniform1f(loc.uProgress, l.progress)
          gl.uniform1i(loc.uMode, l.mode)
          gl.uniform1f(loc.uSeed, l.seed)
          gl.uniform2fv(loc.uOrigin, l.origin)
          gl.drawArrays(gl.TRIANGLES, 0, 3)
          current = next
        }

        gl.bindFramebuffer(gl.FRAMEBUFFER, null)
        gl.uniform1i(loc.uPass, 2)
        gl.activeTexture(gl.TEXTURE0)
        gl.bindTexture(gl.TEXTURE_2D, targets[current].tex)
        gl.drawArrays(gl.TRIANGLES, 0, 3)
        requestAnimationFrame(frame)
      }

      // ui
      const list = document.getElementById('list')
      const buttons = PROJECTS.map(([name], i) => {
        const li = document.createElement('li')
        const button = document.createElement('button')
        button.type = 'button'
        button.textContent = name
        for (const event of ['pointerenter', 'focus', 'click']) button.addEventListener(event, () => go(i + 1))
        li.append(button)
        list.append(li)
        return button
      })
      function markActive(index) {
        list.classList.toggle('has-active', index > 0)
        buttons.forEach((b, i) => b.classList.toggle('active', i + 1 === index))
      }

      const modes = document.getElementById('modes')
      const desc = document.getElementById('desc')
      MODES.forEach(([name], i) => {
        const label = document.createElement('label')
        label.innerHTML = `<input type="radio" name="mode" value="${i}"><kbd>${i + 1}</kbd>${name}`
        modes.append(label)
      })
      function showMode(i) {
        state.mode = i
        modes.querySelectorAll('input')[i].checked = true
        desc.textContent = MODES[i][1]
        MODES.forEach((_, m) => (document.getElementById(`mode-${m}`).hidden = m !== i))
        localStorage.setItem(STORAGE, JSON.stringify({ ...values, mode: i }))
      }
      function setMode(i) {
        showMode(i)
        replay()
      }
      modes.addEventListener('change', (e) => e.target.name === 'mode' && setMode(+e.target.value))
      showMode(state.mode)
      document.getElementById('replay').addEventListener('click', replay)
      addEventListener('keydown', (e) => {
        if (e.target.matches('input[type="range"], select')) return
        const n = Number(e.key)
        if (n >= 1 && n <= MODES.length) setMode(n - 1)
        if (e.key === 'r' || e.key === 'R') replay()
      })

      const copy = document.getElementById('copy')
      copy.addEventListener('click', async () => {
        const relevant = PARAMS.filter((p) => p.mode === null || p.mode === state.mode)
        const text = JSON.stringify({ effect: MODES[state.mode][0], ...Object.fromEntries(relevant.map((p) => [p.id, values[p.id]])) }, null, 2)
        await navigator.clipboard.writeText(text)
        copy.textContent = 'Copied'
        setTimeout(() => (copy.textContent = 'Copy settings'), 1200)
      })
      document.getElementById('reset').addEventListener('click', () => {
        for (const p of PARAMS) {
          values[p.id] = p.value
          inputs[p.id].input.value = p.value
          inputs[p.id].show()
        }
        localStorage.setItem(STORAGE, JSON.stringify({ ...values, mode: state.mode }))
        regenerateGrid(false)
      })

      let autoTimer
      document.getElementById('auto').addEventListener('change', (e) => {
        clearTimeout(autoTimer)
        if (!e.target.checked) return
        // re-reads duration each step so the slider applies while cycling
        const tick = () => {
          go((target() % PROJECTS.length) + 1)
          autoTimer = setTimeout(tick, (values.duration + 0.8) * 1000)
        }
        tick()
      })

      Promise.all([load('/me1920.jpg'), ...PROJECTS.map(([, file]) => load(CDN + file))])
        .then((loaded) => {
          images.push(...loaded)
          status.textContent = ''
          requestAnimationFrame(frame)
        })
        .catch((error) => (status.textContent = error.message))
    </script>
  </body>
</html>
